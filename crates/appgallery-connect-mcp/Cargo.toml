[package]
name = "appgallery-connect-mcp"
description = "MCP server and CLI for the Huawei AppGallery Connect API"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1.0.104"
appgallery-connect-api = { version = "0.1.0", path = "../appgallery-connect-api" }
appgallery-connect-mcp-core = { version = "0.1.0", path = "../appgallery-connect-mcp-core" }
clap = { version = "4.6.7", features = ["derive", "env"] }
dirs = "7.0.0"
rmcp = { version = "3.8.0", default-features = false, features = ["server", "transport-io"] }
# Скрытый ввод секрета API-клиента в терминале (читает из TTY без эха).
rpassword = "7.5.4"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
toml = "1.2.0"
tracing = "0.1.44"
# Логи сервера — только в stderr (stdout занят протоколом MCP).
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["env-filter", "fmt", "std"] }
# Правка `config.toml` Codex с сохранением комментариев и чужих записей.
toml_edit = "0.25.19"
zeroize = "1.8.2"

[dev-dependencies]
rmcp = { version = "3.8.0", default-features = false, features = ["client", "server"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["io-util", "macros", "rt-multi-thread"] }
wiremock = "0.6.5"

[lints]
workspace = true
