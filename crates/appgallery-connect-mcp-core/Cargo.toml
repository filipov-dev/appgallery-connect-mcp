[package]
name = "appgallery-connect-mcp-core"
description = "Transport-agnostic MCP tools for the Huawei AppGallery Connect API"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
appgallery-connect-api = { version = "0.3.2", path = "../appgallery-connect-api" }
# Фильтр `jq` (диалект jaq): разбор, компиляция и выполнение без чтения окружения и файлов.
jaq-core = "3.1.2"
jaq-json = { version = "2.0.3", features = ["serde"] }
jaq-std = "3.0.4"
rmcp = { version = "3.8.0", default-features = false, features = ["server"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# SHA-256 загружаемого файла (хранилище AppGallery Connect сверяет с ним содержимое) и файлов
# страницы приложения (какие изображения изменились с прошлой синхронизации).
sha2 = "0.11.1"
# Процесс фильтра `jq` и его таймаут, уведомления о смене списка инструментов.
tokio = { version = "1.54.1", features = ["io-util", "macros", "process", "rt", "sync", "time"] }
tracing = "0.1.44"

[dev-dependencies]
rmcp = { version = "3.8.0", default-features = false, features = ["client", "server"] }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["io-util", "macros", "rt-multi-thread"] }
# Перехват логов в тестах: секреты не должны попадать и в логи.
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["env-filter", "fmt", "std"] }
wiremock = "0.6.5"

[lints]
workspace = true
