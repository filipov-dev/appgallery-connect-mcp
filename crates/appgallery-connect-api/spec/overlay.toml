# ---------------------------------------------------------------------------
# Уровни доступа.
#
# По умолчанию уровень задаёт HTTP-метод: GET — чтение (read), DELETE — удаление
# (destructive), остальное — запись (write). Здесь только исключения:
#
# - destructive: действия с последствиями для пользователей AppGallery и денег —
#   отправка на проверку, поэтапный выпуск и время выпуска, публичные ответы на отзывы,
#   товары и цены, акции, удаление сертификатов и устройств запросом POST;
# - write: GET, который выдаёт право записи;
# - read: POST, который только читает.
#
# Изменение данных приложения, локализаций и файлов до отправки на проверку остаётся
# записью. reason попадает в описание инструмента.
# ---------------------------------------------------------------------------

[[access]]
level = "destructive"
reason = "sends the version for review; after approval it is released to AppGallery users."
operations = ["publishing.app.submit", "publishing.app.submitWithFile"]

[[access]]
level = "destructive"
reason = "changes which share of users gets the version, pauses the rollout or releases the version to everyone."
operations = ["publishing.phasedRelease.update"]

[[access]]
level = "destructive"
reason = "changes when the approved version is released to users, up to releasing it immediately."
operations = ["publishing.releaseTime.update"]

[[access]]
level = "destructive"
reason = "publishes a reply that all AppGallery users see."
operations = ["comments.review.reply"]

[[access]]
level = "destructive"
reason = "changes products and their prices: this affects what users pay."
operations = ["pms.product.update", "pms.product.batchUpdate"]

[[access]]
level = "destructive"
reason = "puts products on sale or takes them off sale for users."
operations = ["pms.product.batchActivate", "pms.product.batchDeactivate"]

[[access]]
level = "destructive"
reason = "creates or changes a free trial or a promotional price of a subscription."
operations = ["pms.promotion.create", "pms.promotion.update"]

[[access]]
level = "destructive"
reason = "starts or ends promotions for users."
operations = ["pms.promotion.batchActivate", "pms.promotion.batchDeactivate"]

[[access]]
level = "destructive"
reason = "deletes signing certificates with a POST request; this cannot be undone."
operations = ["provisioning.cert.delete"]

[[access]]
level = "destructive"
reason = "deletes registered devices with a POST request; this cannot be undone."
operations = ["provisioning.device.delete"]

[[access]]
level = "write"
reason = "issues one-time credentials for uploading a file to the app."
operations = ["upload.uploadUrl.get"]

[[access]]
level = "read"
reason = "the POST request only reads data."
operations = [
    "pms.productGroup.list",
    "pms.product.search",
    "pms.promotion.search",
    "provisioning.cert.list",
]

# ---------------------------------------------------------------------------
# Исключённые операции: не регистрируются как инструменты, но находятся поиском по
# операциям. `callable = false` запрещает вызов и через `api_request` (по умолчанию
# true). reason — почему операции нет среди инструментов, alternative — что вызвать
# вместо неё.
# ---------------------------------------------------------------------------

[[exclude]]
operations = ["auth.token.create"]
callable = false
reason = "Issues credentials. The server gets and refreshes the access token itself and never returns it."
alternative = "No call is needed: the server authorizes every request with the API client of its profile."

[[exclude]]
operations = [
    "upload.uploadUrl.get",
    "upload.multipart.init",
    "upload.multipart.parts",
    "upload.multipart.compose",
]
callable = false
reason = "Steps of a file upload; their responses consist of one-time upload URLs and authorization headers, which the server does not return, so they are not called through api_request either."
alternative = "For an app package (APK, AAB, RPK, APP, EXE) use package_upload: it uploads the file, in chunks when it is large, and attaches it to the app itself. For the icon, screenshots and videos of the app page use image_sync."

[[exclude]]
operations = ["upload.file.put", "upload.chunk.put"]
callable = false
reason = "Not a Connect API call: the file content is sent to the storage URL from the upload URL response."
alternative = "Use package_upload for an app package or image_sync for the icon, screenshots and videos: they send the file to the storage themselves."

# ---------------------------------------------------------------------------
# Поля ответов с секретами и временными ссылками. Сервер заменяет их значения на "***"
# и пишет агенту пометку note: что скрыто, почему и как получить. kind:
# - credential — учётные данные (секрет приложения): не отдаются никак;
# - download-url — временная ссылка на файл: с аргументом save_to сервер сам скачивает
#   файл (только с хостов Huawei) и отдаёт путь и размер;
# - file-content — содержимое файла с учётными данными: с save_to сервер сохраняет его.
# fields — пути в JSON ответа: имена через точку, [] — каждый элемент массива. Генератор
# сверяет пути со схемой ответа снимка. description и hint — для агента, на английском.
# ---------------------------------------------------------------------------

[[secrets]]
kind = "credential"
description = "the app secret, a credential of the app"
hint = "If the app needs it, the user can view it in the project settings of the app in AppGallery Connect; never ask them to paste it into the conversation."
operations = ["project.appExtraInfo.get"]
fields = ["secret"]

[[secrets]]
kind = "file-content"
description = "the content of the app configuration file agconnect-services.json, which holds the app's credentials"
hint = "Add the saved file to the app project; do not commit it to public repositories."
operations = ["project.configFile.get"]
fields = ["content"]

[[secrets]]
kind = "download-url"
description = "a temporary link to the report file"
hint = "The link is valid only for a short time: pass save_to in the same call."
operations = [
    "reports.downloadInstall.export",
    "reports.iap.export",
    "reports.paidApp.export",
    "reports.paidAppDetails.export",
    "reports.installFailure.export",
]
fields = ["fileURL"]

[[secrets]]
kind = "download-url"
description = "a temporary link to the certificate file, valid for about five minutes"
operations = ["provisioning.cert.create"]
fields = ["certInfo.certDownloadUrl"]

[[secrets]]
kind = "download-url"
description = "a temporary link to the certificate file, valid for about five minutes"
hint = "save_to saves one file: narrow the list to one certificate with certIds in body."
operations = ["provisioning.cert.list"]
fields = ["certInfo[].certDownloadUrl", "certList[].certDownloadUrl"]

[[secrets]]
kind = "download-url"
description = "a temporary link to the provisioning profile file"
operations = ["provisioning.profile.create", "provisioning.profile.updateDevices"]
fields = ["provisionInfo.provisionDownloadUrl"]

[[secrets]]
kind = "download-url"
description = "a temporary link to the provisioning profile file"
hint = "save_to saves one file: narrow the list to one profile with provisionId."
operations = ["provisioning.profile.list"]
fields = ["provisionList[].provisionDownloadUrl"]
