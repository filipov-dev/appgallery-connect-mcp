    "applinking.link.create",
    "applinking.unifiedLink.create",
]

[[toolsets]]
slug = "purchases"
description = "In-app purchases (HMS IAP Order and Subscription services): verify purchase tokens, confirm delivery of consumables, list canceled and refunded purchases and orders, check, cancel, defer, refund and revoke subscriptions. Requests are signed with the app secret of the app (appId argument), not with the API client."
