# ---------------------------------------------------------------------------
# Уровни доступа.
#
# По умолчанию уровень задаёт HTTP-метод: GET — чтение (read), DELETE — удаление
# (destructive), остальное — запись (write). Здесь только исключения:
#
# - destructive: действия с последствиями для пользователей AppGallery и денег —
#   отправка на проверку, поэтапный выпуск и время выпуска, публичные ответы на отзывы,
#   товары и цены, акции, удаление сертификатов и устройств запросом POST, запись и
#   откат Remote Configuration (новая версия сразу действует для пользователей),
#   операции HMS IAP с покупками пользователей (подтверждение доставки, отмена,
#   отсрочка, возврат и отзыв подписки);
# - write: GET, который выдаёт право записи;
# - read: POST, который только читает.
#
# Изменение данных приложения, локализаций и файлов до отправки на проверку остаётся
# записью. reason попадает в описание инструмента.
# ---------------------------------------------------------------------------

[[access]]
level = "destructive"
reason = "sends the version for review; after approval it is released to AppGallery users."
operations = ["publishing.app.submit", "publishing.app.submitWithFile"]

[[access]]
level = "destructive"
reason = "changes which share of users gets the version, pauses the rollout or releases the version to everyone."
operations = ["publishing.phasedRelease.update"]

[[access]]
level = "destructive"
reason = "changes when the approved version is released to users, up to releasing it immediately."
operations = ["publishing.releaseTime.update"]

[[access]]
level = "destructive"
reason = "publishes a reply that all AppGallery users see."
operations = ["comments.review.reply"]

[[access]]
level = "destructive"
reason = "changes products and their prices: this affects what users pay."
operations = ["pms.product.update", "pms.product.batchUpdate"]

[[access]]
level = "destructive"
reason = "puts products on sale or takes them off sale for users."
operations = ["pms.product.batchActivate", "pms.product.batchDeactivate"]

[[access]]
level = "destructive"
reason = "creates or changes a free trial or a promotional price of a subscription."
operations = ["pms.promotion.create", "pms.promotion.update"]

[[access]]
level = "destructive"
reason = "starts or ends promotions for users."
operations = ["pms.promotion.batchActivate", "pms.promotion.batchDeactivate"]

[[access]]
level = "destructive"
reason = "deletes signing certificates with a POST request: profiles issued with them stop working and builds can no longer be signed with them."
operations = ["provisioning.cert.delete"]

[[access]]
level = "destructive"
reason = "deletes registered debugging and testing devices with a POST request: debug profiles and profiles for specific devices can no longer include them, so builds for these devices cannot be signed until the devices are added again."
operations = ["provisioning.device.delete"]

[[access]]
level = "destructive"
reason = "writes a new version of the Remote Configuration from the request body, most likely replacing the whole configuration: it takes effect for the users of the app at once, without a draft or review."
operations = ["remoteconfig.config.update"]

[[access]]
level = "destructive"
reason = "makes an earlier version of the Remote Configuration the current one: it takes effect for the users of the app at once."
operations = ["remoteconfig.config.rollback"]

[[access]]
level = "write"
reason = "issues one-time credentials for uploading a file to the app."
operations = ["upload.uploadUrl.get"]

[[access]]
level = "read"
reason = "the POST request only reads data."
operations = [
    "pms.productGroup.list",
    "pms.product.search",
    "pms.promotion.search",
    "provisioning.cert.list",
]

[[access]]
level = "read"
reason = "the POST request of HMS IAP only reads purchase data."
operations = [
    "orders.purchaseToken.verify",
    "orders.cancelledPurchase.list",
    "orders.merchantOrder.list",
    "subscriptions.purchase.get",
]

[[access]]
level = "destructive"
reason = "marks the purchase of a consumable as delivered: this cannot be undone, and the user can buy the product again."
operations = ["orders.purchase.confirm"]

[[access]]
level = "destructive"
reason = "stops the renewal of the user's subscription; it stays valid until the end of the paid period."
operations = ["subscriptions.purchase.stop"]

[[access]]
level = "destructive"
reason = "moves the next billing date of the user's subscription: the user gets the service free of charge until then."
operations = ["subscriptions.purchase.delay"]

[[access]]
level = "destructive"
reason = "refunds the user's latest subscription payment; this cannot be undone."
operations = ["subscriptions.purchase.returnFee"]

[[access]]
level = "destructive"
reason = "revokes the user's subscription at once and refunds its latest payment; this cannot be undone."
operations = ["subscriptions.purchase.withdraw"]

[[access]]
level = "read"
reason = "POST that only reads orders, subscriptions or notification records."
operations = [
    "iapkit.orderStatus.query",
    "iapkit.tradeOrders.query",
    "iapkit.subscriptionStatus.query",
    "iapkit.order.lookup",
    "iapkit.userOrders.query",
    "iapkit.notifications.query",
]

[[access]]
level = "destructive"
reason = "acknowledges delivery of a user's purchase or subscription; each order can be acknowledged only once."
operations = ["iapkit.orderDelivery.confirm", "iapkit.subscriptionDelivery.confirm"]

[[access]]
level = "destructive"
reason = "moves the renewal date of a user's subscription: the user gets days without charge."
operations = ["iapkit.subscriptionRenewal.postpone"]

[[access]]
level = "destructive"
reason = "answers a user's refund request; an approved refund returns money to the user."
operations = ["iapkit.refundResult.send"]

# ---------------------------------------------------------------------------
# Исключённые операции: не регистрируются как инструменты, но находятся поиском по
# операциям. `callable = false` запрещает вызов и через `api_request` (по умолчанию
# true). reason — почему операции нет среди инструментов, alternative — что вызвать
# вместо неё.
# ---------------------------------------------------------------------------

[[exclude]]
operations = ["auth.token.create"]
callable = false
reason = "Issues credentials. The server gets and refreshes the access token itself and never returns it."
alternative = "No call is needed: the server authorizes every request with the API client of its profile."

[[exclude]]
operations = [
    "upload.uploadUrl.get",
    "upload.multipart.init",
    "upload.multipart.parts",
    "upload.multipart.compose",
]
callable = false
reason = "Steps of a file upload; their responses consist of one-time upload URLs and authorization headers, which the server does not return, so they are not called through api_request either."
alternative = "For an app package (APK, AAB, RPK, APP, EXE) use package_upload: it uploads the file, in chunks when it is large, and attaches it to the app itself. For the icon, screenshots and videos of the app page use image_sync."

[[exclude]]
operations = ["upload.file.put", "upload.chunk.put"]
callable = false
reason = "Not a Connect API call: the file content is sent to the storage URL from the upload URL response."
alternative = "Use package_upload for an app package or image_sync for the icon, screenshots and videos: they send the file to the storage themselves."

[[exclude]]
operations = ["provisioning.cert.create"]
callable = false
reason = "Takes the certificate signing request (CSR) as text in the request body; the server takes the CSR only from a local file, checks it and never sends a private key, so the operation is not called directly or through api_request."
alternative = "Use certificate_request: it reads the CSR from a local file, requests the certificate and saves the certificate file with save_to."

# REST API IAP Kit (HarmonyOS 5 и новее): запросы подписываются JWT ES256 ключом IAP Kit
# (.p8, Key ID, Issuer ID), ответы — JWS с цепочкой сертификатов до Huawei CBG Root CA G2.
# Ни хранения такого ключа, ни проверки JWS в сервере пока нет, поэтому операции только
# находятся поиском и не вызываются даже через api_request.
[[exclude]]
operations = [
    "iapkit.orderStatus.query",
    "iapkit.orderDelivery.confirm",
    "iapkit.tradeOrders.query",
    "iapkit.subscriptionStatus.query",
    "iapkit.subscriptionDelivery.confirm",
    "iapkit.subscriptionRenewal.postpone",
    "iapkit.order.lookup",
    "iapkit.userOrders.query",
    "iapkit.notifications.query",
    "iapkit.notifications.test",
    "iapkit.refundResult.send",
]
callable = false
reason = "HarmonyOS IAP Kit server API (apps on HarmonyOS 5 and later). Its requests are signed with an ES256 JWT made from an IAP Kit key (a .p8 private key with its key ID and issuer ID) and its responses are JWS that must be verified against the Huawei CBG Root CA G2 certificate. This server does not store IAP Kit keys or verify such responses yet, so the operation cannot be called, not even through api_request."
alternative = "For purchases made through HMS IAP (Android apps, HarmonyOS 4 and earlier) use the purchases toolset: verify_product_purchase, get_subscription_purchase and the other tools. For HarmonyOS 5 apps call this API from the app's own server."

# ---------------------------------------------------------------------------
# Поля ответов с секретами и временными ссылками. Сервер заменяет их значения на "***"
# и пишет агенту пометку note: что скрыто, почему и как получить. kind:
# - credential — учётные данные (секрет приложения): не отдаются никак;
# - download-url — временная ссылка на файл: с аргументом save_to сервер сам скачивает
#   файл (только с хостов Huawei) и отдаёт путь и размер;
# - file-content — содержимое файла с учётными данными: с save_to сервер сохраняет его.
# fields — пути в JSON ответа: имена через точку, [] — каждый элемент массива. Генератор
# сверяет пути со схемой ответа снимка. description и hint — для агента, на английском.
# ---------------------------------------------------------------------------

[[secrets]]
kind = "credential"
description = "the app secret, a credential of the app"
hint = "If the app needs it, the user can view it in the project settings of the app in AppGallery Connect; never ask them to paste it into the conversation."
operations = ["project.appExtraInfo.get"]
fields = ["secret"]

[[secrets]]
kind = "file-content"
description = "the content of the app configuration file agconnect-services.json, which holds the app's credentials"
hint = "Add the saved file to the app project; do not commit it to public repositories."
operations = ["project.configFile.get"]
fields = ["content"]

[[secrets]]
kind = "download-url"
description = "a temporary link to the report file"
hint = "The link is valid only for a short time: pass save_to in the same call."
operations = [
    "reports.downloadInstall.export",
    "reports.iap.export",
    "reports.paidApp.export",
    "reports.paidAppDetails.export",
    "reports.installFailure.export",
]
fields = ["fileURL"]

[[secrets]]
kind = "download-url"
description = "a temporary link to the certificate file, valid for about five minutes"
hint = "save_to saves one file: narrow the list to one certificate with certIds in body."
operations = ["provisioning.cert.list"]
fields = ["certInfo[].certDownloadUrl", "certList[].certDownloadUrl"]

[[secrets]]
kind = "download-url"
description = "a temporary link to the provisioning profile file"
hint = "The link is valid only for a short time: pass save_to in the same call; list_profiles with provisionId gives a new link later."
operations = ["provisioning.profile.create", "provisioning.profile.updateDevices"]
fields = ["provisionInfo.provisionDownloadUrl"]

[[secrets]]
kind = "download-url"
description = "a temporary link to the provisioning profile file"
hint = "save_to saves one file: narrow the list to one profile with provisionId."
operations = ["provisioning.profile.list"]
fields = ["provisionList[].provisionDownloadUrl"]

# ---------------------------------------------------------------------------
# Операции с API-клиентом уровня проекта.
#
# Серверные API сервисов проекта (Remote Configuration, App Linking, Auth Service) в
# режиме API-клиента принимают только клиента уровня проекта, а клиента команды, с
# которым работает сервер, отклоняют. Операции из `operations` и все операции групп из
# `groups` исполнитель подписывает клиентом проекта, которого пользователь добавил в
# профиль (`auth project add`). Проект берётся из аргумента `param`, а без ключа — из
# того из `productId` и `projectId`, который есть у операции; параметр должен быть
# обязательным. Операция, для которой справочник называет режимы авторизации без
# `api-client`, сюда не входит.
#
# Операции Project Management API сюда не входят: справочник описывает их только для
# OAuth-клиента и Service Account.
# ---------------------------------------------------------------------------

# Remote Configuration: Project ID — заголовок productId всех четырёх операций.
[[project_credentials]]
groups = ["remoteconfig"]
param = "productId"

# App Linking: Project ID — заголовок productId обеих операций.
[[project_credentials]]
groups = ["applinking"]
param = "productId"

# ---------------------------------------------------------------------------
# Поля ответа, которые сервер убирает из ответа агенту.
#
# reason — почему поля нет (английский текст для агента: попадает в пометку `note`
# ответа и в описание инструмента). fields — пути, как в [[secrets]]; генератор сверяет
# их со схемой ответа снимка.
#
# Поля-строки с JSON внутри (у HMS IAP) отмечены в снимке расширением `x-agc-json`:
# сервер разбирает их в объекты сам, здесь их перечислять не нужно.
# ---------------------------------------------------------------------------

[[omit]]
reason = "the signature covers the original JSON string of the purchase data, which the server parses into an object, so it cannot be verified from this response. A backend that verifies signatures calls the IAP service itself."
operations = ["orders.purchaseToken.verify", "subscriptions.purchase.get"]
fields = ["dataSignature", "signatureAlgorithm"]
