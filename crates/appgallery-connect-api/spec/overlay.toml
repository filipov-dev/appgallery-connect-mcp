# Файл-дополнение к снимку спецификации AppGallery Connect API (spec/openapi.json).
#
# Здесь всё, чего нет в справочнике Huawei: группы API, наборы инструментов, имена
# инструментов, исключения из уровня доступа, исключённые операции и замены для них.
# Операции называются по `operationId` снимка (`publishing.appInfo.get`), внешние
# операции — по ключу в `x-agc-external-operations` (`upload.file.put`).
#
# Ошибки сборки: операция без набора (кроме исключённых с `callable = false`), операция
# в двух наборах, операция без имени инструмента (кроме исключённых), повтор имени, имя
# длиннее 40 символов, ссылка на операцию или группу, которых нет в снимке, группа снимка
# без записи здесь, исключение из уровня доступа, совпадающее с уровнем по умолчанию,
# неизвестные ключи, путь секретного поля, которого нет в схеме ответа.
#
# Тексты description, reason, alternative и hint — для агента, на английском.

# ---------------------------------------------------------------------------
# Группы API (`x-agc-group` снимка) в порядке вывода: название раздела справочника
# и его адрес.
# ---------------------------------------------------------------------------

