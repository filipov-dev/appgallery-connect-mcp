slug = "auth"
title = "Authentication"
reference = "https://developer.huawei.com/consumer/en/doc/development/AppGallery-connect-References/agcapi-obtain_token-0000001158365043"

[[groups]]
slug = "publishing"
title = "Publishing API"
reference = "https://developer.huawei.com/consumer/en/doc/development/AppGallery-connect-References/agcapi-publishing-api-0000002351880118"

[[groups]]
slug = "upload"
title = "Upload Management API"
reference = "https://developer.huawei.com/consumer/en/doc/development/AppGallery-connect-References/agcapi-uploadapi-0000002092927786"

[[groups]]
slug = "reports"
title = "Reports API"
reference = "https://developer.huawei.com/consumer/en/doc/development/AppGallery-connect-References/agcapi-reportsapi-0000001111685194"

[[groups]]
slug = "comments"
title = "Comments API"
reference = "https://developer.huawei.com/consumer/en/doc/development/AppGallery-connect-References/agcapi-commentapi-0000001115868340"

[[groups]]
slug = "pms"
title = "PMS API"
reference = "https://developer.huawei.com/consumer/en/doc/development/AppGallery-connect-References/agcapi-pmsapi-0000001162548121"

[[groups]]
slug = "project"
title = "Project Management API"
reference = "https://developer.huawei.com/consumer/en/doc/development/AppGallery-connect-References/agcapi-pmapi-0000001158245053"

[[groups]]
slug = "provisioning"
title = "Provisioning API"
reference = "https://developer.huawei.com/consumer/en/doc/app/agc-help-provision-api-reference-0000002236041494"

# ---------------------------------------------------------------------------
# Наборы инструментов (--toolsets) в порядке вывода. Каждая операция входит ровно в один
# набор; вне наборов — только исключённые операции с `callable = false`.
# ---------------------------------------------------------------------------

[[toolsets]]
slug = "apps"
description = "Apps: find the app ID by package name, app details with localized listings, review comments and the phased release state."
default = true
operations = [
    "publishing.appId.list",
    "publishing.appInfo.get",
]

[[toolsets]]
slug = "releases"
description = "Releases: upload app packages and attach them to the app, package list and compilation status, submit the app for review, phased release, release time, GMS dependency flag."
default = true
operations = [
    "publishing.fileInfo.update",
    "publishing.package.list",
    "publishing.packageCompileStatus.get",
    "publishing.packageFile.submitByUrl",
    "publishing.app.submit",
    "publishing.app.submitWithFile",
    "publishing.phasedRelease.update",
    "publishing.releaseTime.update",
    "publishing.gmsDependency.update",
    "upload.uploadUrl.get",
    "upload.file.put",
    "upload.multipart.init",
    "upload.multipart.parts",
    "upload.chunk.put",
    "upload.multipart.compose",
]

[[toolsets]]
slug = "listing"
description = "Store listing: basic app information (categories, privacy policy, price, release countries) and localized listings (name, descriptions, what is new)."
operations = [
    "publishing.appInfo.update",
    "publishing.languageInfo.update",
    "publishing.languageInfo.delete",
]

[[toolsets]]
slug = "reviews"
description = "User reviews: list and read reviews, ratings, reply to a review publicly."
default = true
operations = [
    "comments.review.list",
    "comments.review.get",
    "comments.review.reply",
    "comments.rating.list",
]

[[toolsets]]
slug = "reports"
description = "Reports: download and installation, in-app purchases, paid app and installation failure reports as CSV or Excel files."
operations = [
    "reports.downloadInstall.export",
    "reports.iap.export",
    "reports.paidApp.export",
    "reports.paidAppDetails.export",
    "reports.installFailure.export",
]

[[toolsets]]
slug = "products"
description = "In-app products and subscriptions (PMS API): products and their prices, subscription groups, promotions, activation and deactivation."
operations = [
    "pms.product.get",
    "pms.product.search",
    "pms.product.checkActive",
    "pms.product.update",
    "pms.product.batchUpdate",
    "pms.product.batchActivate",
    "pms.product.batchDeactivate",
    "pms.productGroup.list",
    "pms.productGroup.update",
    "pms.promotion.get",
    "pms.promotion.search",
    "pms.promotion.create",
    "pms.promotion.update",
    "pms.promotion.batchActivate",
    "pms.promotion.batchDeactivate",
]

[[toolsets]]
slug = "projects"
description = "Projects (Project Management API): teams, projects and their apps, brief app information, enabled services, the app configuration file, signing certificate fingerprints. The Huawei reference describes these operations only for OAuth clients and service accounts: with the API client of this server they may fail with a permission error."
operations = [
    "project.team.list",
    "project.project.list",
    "project.project.get",
    "project.appBriefInfo.list",
    "project.service.list",
    "project.configFile.get",
    "project.appExtraInfo.get",
    "project.certFingerprint.add",
]

[[toolsets]]
slug = "provisioning"
description = "HarmonyOS signing (Provisioning API): signing certificates, debugging and testing devices, provisioning profiles."
default = false
operations = [
    "provisioning.cert.list",
    "provisioning.cert.create",
    "provisioning.cert.delete",
    "provisioning.device.list",
    "provisioning.device.add",
    "provisioning.device.delete",
    "provisioning.profile.list",
    "provisioning.profile.create",
    "provisioning.profile.updateDevices",
    "provisioning.profile.delete",
]

