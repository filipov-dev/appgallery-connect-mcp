[package]
name = "appgallery-connect-api"
description = "Huawei AppGallery Connect API: spec-driven operations, request executor and API client credential storage"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# Поток файла с ограничением длины для загрузки частями.
futures-util = { version = "0.3.34", default-features = false }
# Secret Service в Linux — через zbus (чистый Rust, рантайм async-io, шифрование
# сессии на Rust): бинарник не линкуется с libdbus и OpenSSL и собирается статически
# (musl). async-io крутит D-Bus в своём потоке, поэтому синхронный API keyring
# можно вызывать из кода внутри tokio-рантайма без взаимоблокировки.
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "async-secret-service", "async-io", "crypto-rust"] }
percent-encoding = "2.3.2"
# rustls без OpenSSL: бинарник собирается статически (musl).
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "stream", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["fs", "io-util", "sync", "time"] }
tracing = "0.1.44"
url = "2.5.8"
zeroize = "1.8.2"

[build-dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.0"

[dev-dependencies]
insta = { version = "1.49.0", features = ["json"] }
# Тесты генератора подключают модули build/*.rs напрямую и нужны их зависимости.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
toml = "1.2.0"
wiremock = "0.6.5"

[lints]
workspace = true
